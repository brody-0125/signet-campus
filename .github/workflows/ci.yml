name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: node dev/prepare-account-realm.mjs
      - run: docker compose -p signet-campus-accounts -f compose.yml -f compose.accounts.yml up -d --build web
      - run: node --test dev/account-continuity.test.mjs
      - if: always()
        run: docker compose -p signet-campus-accounts -f compose.yml -f compose.accounts.yml down -v
  https:
    runs-on: ubuntu-latest
    env:
      CAMPUS_TLS_CERT: secrets/tls.crt
      CAMPUS_API: https://localhost:8443
      CAMPUS_ISSUER: https://localhost:8443/auth/realms/signet-campus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: docker compose -p signet-campus-tls -f compose.yml -f compose.https.yml up -d --build web
      - name: Export public certificate and wait for HTTPS services
        run: |
          mkdir -p secrets
          docker compose -p signet-campus-tls -f compose.yml -f compose.https.yml run --rm --entrypoint cat tls-init /certs/server.crt > secrets/tls.crt
          timeout 120 bash -c 'until curl --cacert secrets/tls.crt -fsS https://localhost:8443/api/achievements >/dev/null && curl --cacert secrets/tls.crt -fsS https://localhost:8443/auth/realms/signet-campus/.well-known/openid-configuration >/dev/null; do sleep 2; done'
      - run: node --test dev/https.test.mjs
      - run: node --test dev/management-ingress.test.mjs
        env:
          CAMPUS_WEB: https://localhost:8443
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/secrets/tls.crt
      - run: node dev/smoke.mjs
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/secrets/tls.crt
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --test dev/prepare-key-rotation.test.mjs
        working-directory: .
      - run: git diff --exit-code -- public/THIRD_PARTY_NOTICES.txt
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile test run --rm tests
      - run: docker compose up -d --build web
      - name: Wait for API and identity provider
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null && curl -fsS http://localhost:8081/realms/signet-campus/.well-known/openid-configuration >/dev/null; do sleep 2; done'
      - run: node dev/smoke.mjs
      - run: node dev/notifications-smoke.mjs
      - run: node --test dev/recovery.test.mjs
      - run: node --test dev/proxy-resolution.test.mjs
      - run: docker compose -f compose.yml -f compose.telemetry.yml up -d web prometheus zipkin
      - name: Wait for local telemetry
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:5173/api/achievements >/dev/null && curl -fsS http://localhost:9411/health >/dev/null && curl -fsS http://localhost:9090/-/ready >/dev/null; do sleep 2; done'
      - run: node --test dev/management-ingress.test.mjs dev/telemetry.test.mjs
      - name: Issuance survives tracing collector outage
        run: |
          docker compose -f compose.yml -f compose.telemetry.yml stop zipkin
          node dev/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: server/build/reports/
