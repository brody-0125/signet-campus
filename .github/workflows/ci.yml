name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- public/THIRD_PARTY_NOTICES.txt
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile test run --rm tests
      - run: docker compose up -d --build web
      - name: Wait for API and identity provider
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null && curl -fsS http://localhost:8081/realms/signet-campus/.well-known/openid-configuration >/dev/null; do sleep 2; done'
      - run: node dev/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: server/build/reports/
