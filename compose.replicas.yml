# Use project signet-campus-replicas: all state belongs to the disposable rehearsal.
x-replica-environment: &replica-environment
  CAMPUS_PUBLIC_URL: http://localhost:5186
  OIDC_ISSUER: http://localhost:8088/realms/signet-campus
  SIGNING_KEY_PATH: /run/secrets/campus-signing.jwk
  VERIFICATION_KEYS: classpath:empty-jwks.json
  SMTP_HOST: smtp-relay
services:
  web:
    build:
      args:
        VITE_OIDC_URL: http://localhost:8088
    ports: !override ["127.0.0.1:5186:8080"]
  server:
    environment: *replica-environment
    ports: !override ["127.0.0.1:8086:8080"]
    depends_on:
      smtp-relay:
        condition: service_started
  replica:
    extends:
      file: compose.yml
      service: server
    environment: *replica-environment
    ports: !override ["127.0.0.1:8087:8080"]
    depends_on:
      smtp-relay:
        condition: service_started
  identity:
    environment:
      KC_HOSTNAME: http://localhost:8088
    ports: !override ["127.0.0.1:8088:8080"]
    volumes:
      - ./secrets/replica-realm.json:/opt/keycloak/data/import/realm.json:ro
  mailpit:
    ports: !override ["127.0.0.1:8027:8025"]
  db:
    ports: !override []
  smtp-relay:
    image: node:24-alpine
    command: ["node", "/workspace/smtp-fault-relay.mjs"]
    volumes:
      - ./dev/smtp-fault-relay.mjs:/workspace/smtp-fault-relay.mjs:ro
    ports: ["127.0.0.1:8099:8080"]
    depends_on: [mailpit]
