spring:
  application:
    name: signet-campus
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/campus}
    username: ${DATABASE_USER:campus}
    password: ${DATABASE_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/signet-campus}
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8081/realms/signet-campus/protocol/openid-connect/certs}
          audiences: signet-campus
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
server:
  shutdown: graceful
campus:
  signing-key: file:${SIGNING_KEY_PATH:/run/secrets/campus-signing.jwk}
  verification-keys: ${VERIFICATION_KEYS:classpath:empty-jwks.json}
  public-url: ${CAMPUS_PUBLIC_URL:http://localhost:5173}
