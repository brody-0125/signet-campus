name: signet-campus
services:
  web:
    build: ./web
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      - server
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: local-campus-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - campus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build: ./server
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/campus
      DATABASE_USER: campus
      DATABASE_PASSWORD: local-campus-only
      OIDC_ISSUER: http://localhost:8081/realms/signet-campus
      OIDC_JWKS: http://identity:8080/realms/signet-campus/protocol/openid-connect/certs
      SIGNING_KEY_PATH: ${SIGNING_KEY_PATH:-/run/secrets/campus-signing.jwk}
      VERIFICATION_KEYS: ${VERIFICATION_KEYS:-classpath:empty-jwks.json}
      SMTP_HOST: mailpit
      NOTIFICATIONS_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - signing-keys:/run/secrets:ro
    depends_on:
      key-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      identity:
        condition: service_started
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.31.1
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data
  identity:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./dev/realm.json:/opt/keycloak/data/import/realm.json:ro
      - identity-data:/opt/keycloak/data
  key-init:
    image: node:24-alpine
    command: ["node", "/workspace/generate-signing-key.mjs", "/keys/campus-signing.jwk"]
    volumes:
      - ./dev/generate-signing-key.mjs:/workspace/generate-signing-key.mjs:ro
      - signing-keys:/keys
  tests:
    image: eclipse-temurin:17-jdk
    profiles: [test]
    working_dir: /workspace/server
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    environment:
      DATABASE_URL: jdbc:postgresql://test-db:5432/campus_test
      DATABASE_USER: campus
      DATABASE_PASSWORD: local-campus-only
    command: ["sh", "./gradlew", "check", "postgresTest", "koverXmlReport", "--no-daemon"]
    depends_on:
      test-db:
        condition: service_healthy
  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: campus_test
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: local-campus-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  mailpit-data:
  signing-keys:
  campus-db:
  identity-data:
  gradle-cache:
